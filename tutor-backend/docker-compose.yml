version: "3.8"

services:
  # Cấu hình cho Database
  postgres_db:
    image: postgres:15-alpine
    container_name: tutor_postgres_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: tutor_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cấu hình cho Node.js API Application
  api_server:
    build: .
    container_name: tutor_api_server
    restart: always
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=development
      - PORT=5050
      # Chuỗi kết nối trỏ trực tiếp tới container db thay vì localhost
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres_db

volumes:
  postgres_data:
