version: "3.8"

services:
  # Cấu hình cho Database
  postgres_db:
    image: postgres:15-alpine
    container_name: tutor_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: binhvo2005
      POSTGRES_DB: tutor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Cấu hình cho Node.js API Application
  api_server:
    build: .
    container_name: tutor_api_server
    restart: always
    ports:
      - "5050:5050"
    environment:
      - NODE_ENV=development
      - PORT=5050
      - DATABASE_URL=postgresql://postgres:binhvo2005@tutor_postgres_db:5432/tutor_db
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres_db

volumes:
  postgres_data:
